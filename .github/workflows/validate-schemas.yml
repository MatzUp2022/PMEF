name: Validate Schemas and Examples

on:
  push:
    branches: [main, develop]
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'catalogs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'diagrams/**'
      - 'spec/**'
      - 'docs/**'
      - '*.md'
      - '.markdownlint.jsonc'
  pull_request:
    branches: [main, develop]
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'catalogs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'diagrams/**'
      - 'spec/**'
      - 'docs/**'
      - '*.md'
      - '.markdownlint.jsonc'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Validate JSON Schema files are well-formed
  # ──────────────────────────────────────────────────────────
  validate-schemas:
    name: JSON Schema syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install jsonschema check-jsonschema

      - name: Validate all schema files are valid JSON
        run: python scripts/validate-schemas.py

      - name: Check schema $ids match file paths
        run: python scripts/check-schema-ids.py

  # ──────────────────────────────────────────────────────────
  # 2. Validate examples against schemas
  # ──────────────────────────────────────────────────────────
  validate-examples:
    name: Validate NDJSON examples
    runs-on: ubuntu-latest
    needs: validate-schemas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate all examples
        run: python scripts/validate-examples.py

      - name: Check example NDJSON is single-line-per-object
        run: python scripts/check-ndjson-format.py

      - name: Check dataset topology (connectivity integrity)
        run: python scripts/check-topology.py

      - name: Check geometry consistency (piping, equipment, steel)
        run: python scripts/check-geometry.py

      - name: Geometry checks detect broken equipment/steel (golden negative fixture)
        run: python tests/geometry/run.py

  # ──────────────────────────────────────────────────────────
  # 3. Validate open catalogs against the catalog schema
  # ──────────────────────────────────────────────────────────
  validate-catalogs:
    name: Validate catalogs
    runs-on: ubuntu-latest
    needs: validate-schemas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate all catalogs
        run: python scripts/validate-catalogs.py

      - name: I/H-section properties consistent with their dimensions (±1 %)
        run: python scripts/i-section-properties.py --check catalogs/profiles-en.json --tolerance 0.01

      - name: Catalog consistency (derived values, designations, schedules, classes vs. dimension catalogs)
        run: python scripts/check-catalogs.py

      - name: Catalog checks detect broken catalogs (golden negative fixture)
        run: python tests/catalogs/run.py

  # ──────────────────────────────────────────────────────────
  # 3b. Conformance test suite (spec 06 §5)
  # ──────────────────────────────────────────────────────────
  conformance-suite:
    name: Conformance suite
    runs-on: ubuntu-latest
    needs: validate-schemas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install jsonschema

      - name: Fixtures and manifest are up to date
        run: python tests/conformance/tools/generate_fixtures.py --check

      - name: Run suite (reference implementation, level 3)
        run: python tests/run_tests.py --level 3

      - name: Self-test (broken implementations must be detected)
        run: python tests/conformance/tools/selftest.py

      - name: Catalog snapping test vectors (pmef-snap/1 Python reference)
        run: python tests/snapping/reference_snap.py

      - name: As-built example matches the snapping algorithm
        run: |
          python scripts/generate-asbuilt-example.py /tmp/asbuilt.ndjson
          diff -u examples/asbuilt-recognition.ndjson /tmp/asbuilt.ndjson

  # ──────────────────────────────────────────────────────────
  # 4. Check Mermaid diagrams are syntactically valid
  # ──────────────────────────────────────────────────────────
  validate-diagrams:
    name: Validate Mermaid diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Create puppeteer config
        run: |
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/puppeteer-config.json

      - name: Validate all Mermaid diagrams
        run: |
          for f in diagrams/*.md; do
            echo "Checking $f ..."
            outdir="/tmp/mermaid-blocks"
            rm -rf "$outdir"
            count=$(python scripts/extract-mermaid.py "$f" "$outdir")
            if [ "$count" -eq 0 ]; then
              echo "  No mermaid blocks found, skipping."
              continue
            fi
            for block in "$outdir"/*.mmd; do
              echo "  Validating $(basename "$block") ..."
              mmdc --input "$block" --output /tmp/mermaid-output.svg \
                --puppeteerConfigFile /tmp/puppeteer-config.json
            done
          done

  # ──────────────────────────────────────────────────────────
  # 5. Lint Markdown files
  # ──────────────────────────────────────────────────────────
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            *.md
            spec/*.md
            spec/rfc/*.md
            docs/*.md
            diagrams/*.md
          config: .markdownlint.jsonc

  # ──────────────────────────────────────────────────────────
  # 6. Check for broken internal links
  # ──────────────────────────────────────────────────────────
  check-links:
    name: Check internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --no-progress
            --exclude-all-private
            --exclude 'https://discord.gg'
            --exclude 'https://pmef.net'
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────
  # Summary job — required for branch protection
  # ──────────────────────────────────────────────────────────
  ci-success:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [validate-schemas, validate-examples, validate-catalogs, conformance-suite, validate-diagrams, lint-markdown]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.validate-schemas.result }}" != "success" ]] || \
             [[ "${{ needs.validate-examples.result }}" != "success" ]] || \
             [[ "${{ needs.validate-catalogs.result }}" != "success" ]] || \
             [[ "${{ needs.conformance-suite.result }}" != "success" ]] || \
             [[ "${{ needs.validate-diagrams.result }}" != "success" ]] || \
             [[ "${{ needs.lint-markdown.result }}" != "success" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All checks passed"
