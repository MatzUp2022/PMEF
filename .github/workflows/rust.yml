name: Rust

on:
  push:
    branches: [main, develop]
    paths:
      - 'pmef-rs/**'
      - 'schemas/**'
      - 'examples/**'
      - 'tests/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'pmef-rs/**'
      - 'schemas/**'
      - 'examples/**'
      - 'tests/**'
      - '.github/workflows/rust.yml'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: pmef-rs

jobs:
  # ──────────────────────────────────────────────────────────
  # Build + test the whole workspace (core, CLI, all adapters)
  # ──────────────────────────────────────────────────────────
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pmef-rs

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace (unit, integration, doc tests)
        run: cargo test --workspace --no-fail-fast

      - name: CLI validates every example against the schemas
        run: |
          for f in ../examples/*.ndjson; do
            echo "== $f"
            cargo run -q -p pmef-cli -- validate "$f" --schemas ../schemas
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conformance suite — pmef CLI as validator (cross-check with the Python reference)
        run: |
          pip install jsonschema
          cargo build -p pmef-cli
          cd ..
          python tests/run_tests.py --kind validator --name pmef-cli \
            --validator "pmef-rs/target/debug/pmef validate {file} --schemas schemas >/dev/null 2>&1"

  # ──────────────────────────────────────────────────────────
  # Lints — reported, not yet gating (~1600 pre-existing warnings,
  # mostly missing doc comments; see docs/AUDIT.md)
  # ──────────────────────────────────────────────────────────
  clippy:
    name: Clippy (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pmef-rs

      - name: Clippy (errors fail, warnings reported)
        run: cargo clippy --workspace --all-targets
