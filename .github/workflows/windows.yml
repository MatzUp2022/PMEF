name: Windows

# Rust-Workspace auf Marcels Windows-PC (self-hosted, Label matz-pc).
# Öffentliches Repo: bewusst KEIN pull_request-Trigger, damit Code aus Fork-PRs
# nie auf dem PC läuft. Nur Pushes auf main/develop und manueller Start.
# Ist der PC aus, wartet der Job, bis er wieder online ist.
on:
  # Vorerst nur manuell (Actions -> Windows -> Run workflow), bis der Runner auf dem PC
  # installiert ist (ci-runner, Schritt 4). Danach push/pull_request wieder aktivieren.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: pmef-rs

jobs:
  test:
    name: Build and test (Windows)
    runs-on: [self-hosted, windows, matz-pc]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pmef-rs

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace --no-fail-fast

      - name: Clippy (informativ, wie rust.yml)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets
