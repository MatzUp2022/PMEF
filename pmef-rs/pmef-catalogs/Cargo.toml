[package]
name = "pmef-catalogs"
description = "PMEF engineering catalogs (pipe and flange dimensions, piping classes, materials, profiles) embedded for consumers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
# Not the workspace entry: that enables `preserve_order`, and Cargo feature unification would
# switch every consumer's serde_json (e.g. DEXPI-Manager) to IndexMap-backed maps.
serde_json = "1"
