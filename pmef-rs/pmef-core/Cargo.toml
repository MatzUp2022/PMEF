[package]
name        = "pmef-core"
description = "PMEF data model — entity types, property sets, relationships"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true

[dependencies]
serde.workspace     = true
# Not the workspace entry: that enables `preserve_order`, and Cargo feature unification would
# switch every consumer's serde_json (e.g. DEXPI-Manager) to IndexMap-backed maps.
serde_json = "1"
thiserror.workspace = true
uuid.workspace      = true
chrono.workspace    = true
tracing.workspace   = true

[dev-dependencies]
serde_json = { version = "1" }
